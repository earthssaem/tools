<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연경쌤의 업무 도구함</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- 임시 목록 페이지. 허브 디자인은 따로 정한 뒤 바꾼다. -->
<style>
  body { margin: 0; font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", system-ui, sans-serif; color: #1d2433; background: #fff; line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px 24px; }
  h1 { font-size: 24px; margin: 0 0 24px; display: flex; align-items: center; gap: 12px; }
  h1 img { width: 40px; height: 40px; flex: none; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.card { display: flex; align-items: center; gap: 14px; border: 1px solid #dfe2e8; border-radius: 8px; padding: 14px 16px; color: inherit; text-decoration: none; }
  a.card img { width: 40px; height: 40px; flex: none; }
  a.card:hover, a.card:focus-visible { border-color: #2456c9; }
  .name { font-weight: 700; }
  .desc { color: #5a6375; font-size: 14px; }
  footer { max-width: 640px; margin: 0 auto; padding: 24px 20px 40px; color: #5a6375; font-size: 13px; }
  footer .hub { color: inherit; font-weight: 500; white-space: nowrap; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 3px; }
  footer .hub:hover { color: #1d2433; text-decoration-color: currentColor; }
</style>
</head>
<body>
<main>
  <h1><img src="icon.svg" alt="">연경쌤의 업무 도구함</h1>
  <ul>
    <li><a class="card" href="pdf/">
      <img src="pdf/icon.svg" alt="">
      <div>
        <div class="name">PDF 업무 도구</div>
        <div class="desc">PDF 합치기·페이지 삭제·순서 정리, 개인정보 가명 처리, Markdown 변환</div>
      </div>
    </a></li>
    <li><a class="card" href="gif/">
      <img src="gif/icon.svg" alt="">
      <div>
        <div class="name">움짤 메이커</div>
        <div class="desc">웹앱 화면을 녹화해 기능별 GIF로 자르고, 블로그 용량에 맞춰 저장</div>
      </div>
    </a></li>
  </ul>
</main>
<footer>© 2026 제작: 김연경(earthssaem@gmail.com) | <a class="hub" href="https://earthssaem-lab.vercel.app/" target="_blank" rel="noopener">연경쌤의 지구과학 실험실 둘러보기 →</a></footer>
</body>
</html>
